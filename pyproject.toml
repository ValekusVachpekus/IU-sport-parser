[project]
name = "sportparser"
version = "0.1.0"
description = "Telegram bot that auto-checks-in to Innopolis sport sessions the moment sign-up opens (exactly 7 days before) or a spot frees up."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
